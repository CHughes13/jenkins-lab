# Define the events block (required by nginx, handles connection processing)
events {}

http {
    server {
        # Nginx listens on port 80 (standard HTTP port)
        listen 80;

        # Handle all requests coming to the root URL
        location / {
            # Forward requests to Flask container on port 5000
            # 'flask-app' is the container name on our Docker network  
            proxy_pass http://flask-app:5000;
            
            # Pass the original host address to Flask
            proxy_set_header Host $host;

            # Pass the real user IP address to Flask
            # Without this Flask would see Nginx's IP instead
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}